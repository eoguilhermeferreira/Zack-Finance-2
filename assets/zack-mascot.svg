<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E88E5"/>
      <stop offset="100%" stop-color="#0B3FA8"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFDAB3"/>
      <stop offset="100%" stop-color="#F0B07A"/>
    </radialGradient>
    <clipPath id="circle">
      <circle cx="60" cy="60" r="60"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="60" cy="60" r="60" fill="url(#bg)"/>

  <g clip-path="url(#circle)">
    <!-- Suit body -->
    <ellipse cx="60" cy="108" rx="38" ry="28" fill="#1A237E"/>
    <rect x="50" y="82" width="20" height="30" fill="#1565E0"/>

    <!-- White shirt -->
    <polygon points="60,82 52,90 60,95 68,90" fill="#FFFFFF"/>

    <!-- Green tie -->
    <polygon points="60,82 57,88 60,95 63,88" fill="#2DB36A"/>
    <polygon points="58,92 60,98 62,92 60,95" fill="#1F8A4C"/>

    <!-- Head -->
    <circle cx="60" cy="62" r="24" fill="url(#face)"/>

    <!-- Hair -->
    <ellipse cx="60" cy="43" rx="22" ry="12" fill="#6D3F1F"/>
    <ellipse cx="72" cy="46" rx="10" ry="8" fill="#8B5A2B"/>
    <!-- Sweep -->
    <path d="M38 50 Q45 36 62 38 Q55 44 50 52" fill="#6D3F1F"/>

    <!-- Headset band -->
    <path d="M38 58 Q38 38 60 36 Q82 38 82 58" fill="none" stroke="#37474F" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Left ear cup -->
    <circle cx="38" cy="59" r="7" fill="#37474F"/>
    <circle cx="38" cy="59" r="4.5" fill="#1565E0"/>
    <!-- Right ear cup -->
    <circle cx="82" cy="59" r="7" fill="#37474F"/>
    <circle cx="82" cy="59" r="4.5" fill="#1565E0"/>

    <!-- Mic arm -->
    <path d="M38 63 Q34 70 36 76" fill="none" stroke="#37474F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="36" cy="77" r="3" fill="#546E7A"/>

    <!-- Eyes -->
    <circle cx="52" cy="62" r="5.5" fill="white"/>
    <circle cx="68" cy="62" r="5.5" fill="white"/>
    <circle cx="53" cy="62" r="3.2" fill="#1565E0"/>
    <circle cx="69" cy="62" r="3.2" fill="#1565E0"/>
    <circle cx="54" cy="61" r="1.2" fill="white"/>
    <circle cx="70" cy="61" r="1.2" fill="white"/>

    <!-- Eyebrows -->
    <path d="M47 56.5 Q52 54 57 56" fill="none" stroke="#5D3B1E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M63 56 Q68 54 73 56.5" fill="none" stroke="#5D3B1E" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M51 72 Q60 79 69 72" fill="none" stroke="#C0623A" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Cheek blush -->
    <ellipse cx="46" cy="70" rx="5" ry="3" fill="#FFB3A0" opacity="0.5"/>
    <ellipse cx="74" cy="70" rx="5" ry="3" fill="#FFB3A0" opacity="0.5"/>

    <!-- Thumbs up hand -->
    <rect x="78" y="85" width="12" height="8" rx="3" fill="#FFDAB3"/>
    <rect x="78" y="78" width="7" height="12" rx="3" fill="#FFDAB3"/>
    <path d="M82 78 Q86 74 88 77" fill="none" stroke="#F0B07A" stroke-width="1.5"/>
  </g>
</svg>

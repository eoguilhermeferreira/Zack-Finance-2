<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Zack Finance</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
/* ─── Design tokens ─────────────────────────────────────────────────────────── */
:root {
  --brand-blue-deep: #0B3FA8;
  --brand-blue:      #1565E0;
  --brand-cyan:      #1FA8E0;
  --brand-green:     #1F8A4C;
  --brand-green-soft:#2DB36A;
  --brand-red:       #E5484D;
  --brand-amber:     #F2A03D;
  --brand-violet:    #7C5CE0;
  --bg:        #F6F7FB;
  --bg-2:      #EEF1F7;
  --surface:   #FFFFFF;
  --surface-2: #FAFBFD;
  --line:      #E6E9F0;
  --line-2:    #EDF0F5;
  --text:      #0E1726;
  --text-2:    #4B5567;
  --text-3:    #8A93A6;
  --shadow-sm: 0 1px 2px rgba(15,30,60,.04);
  --shadow-md: 0 6px 24px -8px rgba(15,30,60,.12), 0 2px 6px rgba(15,30,60,.05);
  --shadow-lg: 0 24px 60px -20px rgba(15,30,60,.22), 0 8px 20px -10px rgba(15,30,60,.10);
  --radius:    12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --sidebar-w: 256px;
  --topbar-h:  62px;
}
html[data-theme="dark"] {
  --bg: #0A0F1C; --bg-2: #0E1525; --surface: #121A2C; --surface-2: #0F1726;
  --line: #1F2A41; --line-2: #1A2438; --text: #EAF0FB; --text-2: #A6B0C5; --text-3: #6F7A93;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
  --shadow-md: 0 8px 28px -10px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.30);
  --shadow-lg: 0 30px 70px -20px rgba(0,0,0,.65), 0 10px 24px -10px rgba(0,0,0,.45);
}

/* ─── Reset ─────────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { overflow-x: hidden; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden; width: 100%;
  min-height: 100vh;
}
h1,h2,h3,h4 { font-family: 'Sora','Inter',sans-serif; letter-spacing: -.01em; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

/* ─── Animations ────────────────────────────────────────────────────────────── */
@keyframes spin    { to { transform: rotate(360deg); } }
@keyframes fadeIn  { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
@keyframes scaleIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
@keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
@keyframes float    { 0%,100%{transform:translateY(0)rotate(-2deg)} 50%{transform:translateY(-14px)rotate(-2deg)} }
@keyframes floatAlt { 0%,100%{transform:translateY(0)rotate(2deg)}  50%{transform:translateY(-10px)rotate(2deg)} }

.fadein  { animation: fadeIn .22s ease both; }
.tabular { font-variant-numeric: tabular-nums; }
.mono    { font-family: 'JetBrains Mono', monospace; }

/* ─── Scrollbar ─────────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--line); border-radius:6px; }
::-webkit-scrollbar-thumb:hover { background:var(--text-3); }

/* ─── Buttons ───────────────────────────────────────────────────────────────── */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 15px; border-radius:10px; font-weight:600; font-size:13.5px;
  background:var(--surface); color:var(--text); border:1px solid var(--line);
  transition:transform .12s, background .15s, border-color .15s, box-shadow .15s;
  white-space:nowrap; min-height:38px; flex-shrink:0;
}
.btn:hover  { background:var(--bg-2); border-color:var(--text-3); }
.btn:active { transform:translateY(1px); }
.btn-primary {
  background:linear-gradient(180deg,var(--brand-blue),var(--brand-blue-deep));
  color:#fff; border-color:transparent;
  box-shadow:0 5px 14px -6px var(--brand-blue), inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-primary:hover { filter:brightness(1.07); }
.btn-ghost  { background:transparent; border-color:transparent; }
.btn-ghost:hover { background:var(--bg-2); }
.btn-danger { color:var(--brand-red); }
.btn-danger:hover { background:color-mix(in oklab,var(--brand-red) 10%,transparent); border-color:color-mix(in oklab,var(--brand-red) 30%,transparent); }
.btn-sm  { padding:7px 11px; font-size:12.5px; border-radius:8px; min-height:34px; }
.btn-icon { padding:7px; width:34px; height:34px; min-height:unset; }

/* ─── Forms ─────────────────────────────────────────────────────────────────── */
.field { display:flex; flex-direction:column; gap:5px; }
.field>label { font-size:12px; font-weight:600; color:var(--text-2); letter-spacing:.01em; }
.input, .select, .textarea {
  width:100%; padding:11px 13px; background:var(--surface); color:var(--text);
  border:1px solid var(--line); border-radius:10px; outline:none;
  font-size:16px; /* prevents iOS zoom */
  transition:border-color .15s, box-shadow .15s;
  min-height:46px;
}
.input:focus,.select:focus,.textarea:focus {
  border-color:var(--brand-blue);
  box-shadow:0 0 0 3px color-mix(in oklab,var(--brand-blue) 18%,transparent);
}
.textarea { min-height:80px; resize:vertical; font-size:15px; }
.input::placeholder,.textarea::placeholder { color:var(--text-3); }

/* ─── Card ───────────────────────────────────────────────────────────────────── */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); }

/* ─── App layout ────────────────────────────────────────────────────────────── */
#app {
  display:grid; grid-template-columns:var(--sidebar-w) 1fr;
  min-height:100vh; width:100%; overflow-x:hidden;
}
#app.collapsed { --sidebar-w:76px; }

/* ─── Desktop Sidebar ───────────────────────────────────────────────────────── */
.sidebar {
  background:var(--surface); border-right:1px solid var(--line);
  position:sticky; top:0; height:100vh;
  display:flex; flex-direction:column; overflow:hidden;
  transition:width .2s ease;
}
.sidebar-head {
  display:flex; align-items:center; gap:10px;
  height:var(--topbar-h); padding:0 16px;
  border-bottom:1px solid var(--line); flex:none;
}
.brand-mark {
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg,var(--brand-blue),var(--brand-blue-deep));
  display:grid; place-items:center; flex:none; overflow:hidden;
}
.brand-name { font-family:'Sora'; font-weight:700; font-size:16px; white-space:nowrap; }
.brand-name small { display:block; font-family:'Inter'; font-weight:500; color:var(--text-3); font-size:10px; letter-spacing:.12em; text-transform:uppercase; }

.nav { padding:10px 8px; display:flex; flex-direction:column; gap:2px; flex:1; overflow-y:auto; overflow-x:hidden; }
.nav-section { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--text-3); padding:12px 10px 5px; }
.nav-item {
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:10px;
  color:var(--text-2); font-weight:500; font-size:13.5px;
  transition:background .15s,color .15s; position:relative; cursor:pointer; white-space:nowrap;
}
.nav-item:hover { background:var(--bg-2); color:var(--text); }
.nav-item.active { background:color-mix(in oklab,var(--brand-blue) 10%,transparent); color:var(--brand-blue); }
html[data-theme="dark"] .nav-item.active { background:color-mix(in oklab,var(--brand-blue) 22%,transparent); color:#cfe0ff; }
.nav-item.active::before { content:""; position:absolute; left:-8px; top:8px; bottom:8px; width:3px; border-radius:0 3px 3px 0; background:var(--brand-blue); }
.nav-item .nav-icon { width:20px; height:20px; flex:none; display:flex; align-items:center; justify-content:center; }
.nav-item .nav-badge { margin-left:auto; font-size:9px; padding:2px 6px; border-radius:99px; background:var(--brand-blue); color:#fff; font-weight:700; }
#app.collapsed .nav-item span:not(.nav-badge),#app.collapsed .nav-section,#app.collapsed .brand-name,#app.collapsed .sidebar-foot-text { display:none; }
#app.collapsed .sidebar-head { justify-content:center; padding:0; }
#app.collapsed .nav-item { justify-content:center; }
.sidebar-foot { border-top:1px solid var(--line); padding:12px; display:flex; align-items:center; gap:10px; flex:none; }
.avatar { width:36px; height:36px; border-radius:50%; flex:none; background:linear-gradient(135deg,#FFB37A,#E5484D); display:grid; place-items:center; color:#fff; font-weight:700; font-size:13px; }

/* ─── Hamburger (mobile only) ───────────────────────────────────────────────── */
.hamburger-btn {
  display:none; width:42px; height:42px; border-radius:10px;
  align-items:center; justify-content:center;
  color:var(--text-2); border:1px solid var(--line);
  background:var(--surface); cursor:pointer; flex-shrink:0;
}

/* ─── Mobile overlay ────────────────────────────────────────────────────────── */
.mobile-overlay {
  position:fixed; inset:0; background:rgba(8,15,30,.6);
  backdrop-filter:blur(4px); z-index:150;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.mobile-overlay.open { opacity:1; pointer-events:all; }

/* ─── Mobile Sidebar ────────────────────────────────────────────────────────── */
.mobile-sidebar {
  position:fixed; top:0; left:0; bottom:0; width:min(290px, 85vw);
  background:var(--surface); border-right:1px solid var(--line);
  box-shadow:var(--shadow-lg); z-index:151;
  display:flex; flex-direction:column;
  transform:translateX(-100%); transition:transform .28s cubic-bezier(.4,0,.2,1);
  overflow-y:auto; overflow-x:hidden;
}
.mobile-sidebar.open { transform:translateX(0); }
.mobile-sidebar-head {
  display:flex; align-items:center; gap:10px;
  height:70px; padding:0 18px; border-bottom:1px solid var(--line); flex-shrink:0;
}
.mobile-sidebar-close {
  margin-left:auto; width:38px; height:38px; border-radius:10px;
  display:grid; place-items:center; color:var(--text-2);
  border:1px solid var(--line); background:transparent; cursor:pointer; flex-shrink:0;
}
.mobile-nav { padding:12px 8px; display:flex; flex-direction:column; gap:2px; flex:1; }
.mobile-nav-section { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:var(--text-3); padding:14px 12px 6px; }
.mobile-nav-item {
  display:flex; align-items:center; gap:13px;
  padding:13px 14px; border-radius:12px;
  color:var(--text-2); font-weight:500; font-size:15px;
  cursor:pointer; min-height:52px;
  transition:background .12s, color .12s;
}
.mobile-nav-item:hover  { background:var(--bg-2); color:var(--text); }
.mobile-nav-item:active { background:var(--bg-2); }
.mobile-nav-item.active { background:color-mix(in oklab,var(--brand-blue) 10%,transparent); color:var(--brand-blue); font-weight:600; }
html[data-theme="dark"] .mobile-nav-item.active { background:color-mix(in oklab,var(--brand-blue) 22%,transparent); color:#cfe0ff; }
.mobile-nav-item .nav-badge { margin-left:auto; font-size:10px; padding:3px 8px; border-radius:99px; background:var(--brand-green-soft); color:#fff; font-weight:700; }
.mobile-sidebar-foot { border-top:1px solid var(--line); padding:16px 18px; display:flex; align-items:center; gap:12px; flex-shrink:0; }

/* ─── Main area ─────────────────────────────────────────────────────────────── */
.main-area { display:flex; flex-direction:column; min-width:0; overflow-x:hidden; }

/* ─── Topbar ─────────────────────────────────────────────────────────────────── */
.topbar {
  height:var(--topbar-h); background:color-mix(in oklab,var(--surface) 90%,transparent);
  backdrop-filter:saturate(140%) blur(10px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:0 20px;
  position:sticky; top:0; z-index:50; flex:none;
  width:100%;
}
.search {
  flex:1; max-width:420px; display:flex; align-items:center; gap:8px;
  background:var(--bg-2); border:1px solid var(--line); border-radius:10px;
  padding:8px 12px; color:var(--text-3);
}
.search input { background:transparent; border:0; outline:0; flex:1; color:var(--text); font-size:13.5px; }
.search kbd { font-family:'JetBrains Mono'; font-size:10px; padding:2px 5px; background:var(--surface); border:1px solid var(--line); border-radius:5px; color:var(--text-3); white-space:nowrap; }
.icon-btn {
  width:38px; height:38px; border-radius:10px;
  display:grid; place-items:center; color:var(--text-2);
  border:1px solid transparent; cursor:pointer; position:relative; flex-shrink:0;
  transition:background .12s, color .12s;
}
.icon-btn:hover { background:var(--bg-2); color:var(--text); }
.icon-btn .ping { position:absolute; top:7px; right:8px; width:8px; height:8px; border-radius:99px; background:var(--brand-red); border:2px solid var(--surface); }

/* ─── Notification dropdown ─────────────────────────────────────────────────── */
.notif-dropdown {
  position:absolute; top:46px; right:0;
  width:min(340px, calc(100vw - 24px));
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  box-shadow:var(--shadow-lg); z-index:300; overflow-y:auto; max-height:400px;
  animation:scaleIn .15s cubic-bezier(.2,.9,.3,1.1) both; transform-origin:top right;
}
.notif-header { padding:13px 16px 10px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
.notif-header h4 { font-size:14px; font-weight:700; }
.notif-item { display:flex; align-items:flex-start; gap:11px; padding:13px 16px; border-bottom:1px solid var(--line-2); }
.notif-item:last-child { border-bottom:0; }
.notif-icon { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; flex-shrink:0; font-size:16px; }
.notif-title { font-size:13px; font-weight:600; margin-bottom:3px; }
.notif-msg   { font-size:12px; color:var(--text-2); line-height:1.5; }
.notif-empty { padding:32px 16px; text-align:center; color:var(--text-3); font-size:13.5px; }

/* ─── Page ───────────────────────────────────────────────────────────────────── */
.page {
  padding:24px 24px 48px;
  max-width:1400px; margin:0 auto;
  animation:fadeIn .25s ease both;
  width:100%;
  /* Critical: prevent content from overflowing */
  overflow-x:hidden;
}
.page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
.page-head h1 { font-size:26px; font-weight:700; }
.page-head .sub { color:var(--text-2); font-size:13.5px; margin-top:4px; }

/* ─── Stat grid ─────────────────────────────────────────────────────────────── */
.stat-grid { display:grid; gap:14px; grid-template-columns:repeat(4,1fr); }
@media (max-width:1100px) { .stat-grid { grid-template-columns:repeat(2,1fr); } }
.stat { padding:18px; display:flex; flex-direction:column; gap:12px; position:relative; overflow:hidden; }
.stat-head { display:flex; align-items:center; justify-content:space-between; }
.stat-head .label { font-size:11.5px; color:var(--text-2); font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
.stat-icon { width:36px; height:36px; border-radius:10px; display:grid; place-items:center; flex-shrink:0; }
.stat-value { font-family:'Sora'; font-weight:700; font-size:22px; letter-spacing:-.02em; word-break:break-word; }
.stat-foot  { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--text-2); flex-wrap:wrap; }
.delta-up   { color:var(--brand-green-soft); font-weight:600; }
.delta-down { color:var(--brand-red); font-weight:600; }
.spark-bg { position:absolute; right:-10px; bottom:-2px; width:150px; height:54px; opacity:.5; pointer-events:none; }

/* ─── Grid layouts ───────────────────────────────────────────────────────────── */
.grid-2-1 { display:grid; gap:14px; grid-template-columns:2fr 1fr; }
@media (max-width:1000px) { .grid-2-1 { grid-template-columns:1fr; } }

/* ─── Table ─────────────────────────────────────────────────────────────────── */
.table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.table { width:100%; border-collapse:separate; border-spacing:0; font-size:13.5px; min-width:400px; }
.table thead th { text-align:left; font-weight:600; color:var(--text-2); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:10px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap; }
.table tbody td { padding:12px 14px; border-bottom:1px solid var(--line-2); vertical-align:middle; }
.table tbody tr:hover td { background:var(--surface-2); }
.table tbody tr:last-child td { border-bottom:0; }
.cat-pill { display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap; }

/* ─── Modal ─────────────────────────────────────────────────────────────────── */
.modal-backdrop {
  position:fixed; inset:0; background:rgba(8,15,30,.55);
  backdrop-filter:blur(4px); display:grid; place-items:center;
  z-index:200; padding:16px; animation:fadeIn .15s ease both;
}
.modal {
  width:100%; max-width:520px; background:var(--surface);
  border:1px solid var(--line); border-radius:var(--radius-xl);
  box-shadow:var(--shadow-lg); animation:scaleIn .18s cubic-bezier(.2,.9,.3,1.2) both;
  overflow:hidden;
}
.modal-head { padding:20px 20px 8px; display:flex; justify-content:space-between; align-items:start; }
.modal-head h3 { font-size:18px; font-weight:700; }
.modal-head p  { color:var(--text-2); font-size:13px; margin:4px 0 0; }
.modal-body { padding:14px 20px 20px; display:grid; gap:14px; }
.modal-foot { padding:14px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; background:var(--surface-2); }

/* ─── Toast ─────────────────────────────────────────────────────────────────── */
.toast-host { position:fixed; bottom:24px; right:24px; z-index:400; display:flex; flex-direction:column; gap:10px; pointer-events:none; max-width:320px; }
.toast { background:var(--surface); border:1px solid var(--line); padding:13px 16px; border-radius:12px; box-shadow:var(--shadow-md); display:flex; align-items:center; gap:10px; animation:slideUp .2s ease both; pointer-events:all; min-width:220px; }
.toast .dot { width:8px; height:8px; border-radius:99px; flex:none; }

/* Bottom nav hidden */
.bottom-nav { display:none !important; }

/* ─── Chart ─────────────────────────────────────────────────────────────────── */
.chart-card { padding:20px; }
.chart-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
.chart-head h3 { font-size:15px; font-weight:700; }
.chart-tabs { display:flex; gap:3px; padding:3px; background:var(--bg-2); border-radius:8px; border:1px solid var(--line); }
.chart-tab { padding:5px 10px; border-radius:6px; font-size:12px; font-weight:600; color:var(--text-2); cursor:pointer; transition:background .12s, color .12s; white-space:nowrap; }
.chart-tab.active { background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); }

/* ─── Zack FAB ───────────────────────────────────────────────────────────────── */
.zack-fab {
  position:fixed; bottom:24px; right:24px;
  width:58px; height:58px; border-radius:50%;
  background:linear-gradient(135deg,var(--brand-blue),var(--brand-blue-deep));
  display:grid; place-items:center;
  box-shadow:0 8px 24px -8px rgba(21,101,224,.6);
  z-index:70; cursor:pointer; color:#fff; border:none; overflow:hidden;
  transition:transform .15s, box-shadow .15s;
}
.zack-fab:hover  { transform:translateY(-2px) scale(1.06); }
.zack-fab:active { transform:scale(.97); }

/* ─── Auth ───────────────────────────────────────────────────────────────────── */
.auth-shell { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
.auth-art {
  position:relative; overflow:hidden; min-height:100vh;
  background:
    radial-gradient(80% 60% at 30% 20%, color-mix(in oklab,var(--brand-cyan) 40%,transparent),transparent 60%),
    radial-gradient(70% 80% at 80% 80%, color-mix(in oklab,var(--brand-green-soft) 35%,transparent),transparent 60%),
    linear-gradient(180deg,var(--brand-blue-deep),#061738);
  color:#fff; padding:48px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.auth-form-side { display:grid; place-items:center; padding:32px; background:var(--bg); min-height:100vh; }
.auth-form-side .form-card { width:100%; max-width:420px; }

.mockup-cards-area { position:absolute; right:-10px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; align-items:flex-end; pointer-events:none; z-index:2; }
.mockup-card          { animation:float    5s   ease-in-out infinite; filter:drop-shadow(0 24px 48px rgba(0,0,0,.45)); }
.mockup-card-secondary{ animation:floatAlt 6.5s ease-in-out infinite; filter:drop-shadow(0 16px 36px rgba(0,0,0,.35)); margin-top:-60px; margin-right:30px; }

/* ─── Alerts ─────────────────────────────────────────────────────────────────── */
.alert-banner { display:flex; align-items:flex-start; gap:12px; padding:13px 16px; border-radius:12px; font-size:13.5px; font-weight:500; margin-bottom:16px; border:1px solid; line-height:1.55; }
.alert-banner.warning { background:#fefce8; border-color:#fde047; color:#854d0e; }
.alert-banner.error   { background:#fee2e2; border-color:#fca5a5; color:#991b1b; }
.alert-banner.info    { background:#eff6ff; border-color:#bfdbfe; color:#1e40af; }
html[data-theme="dark"] .alert-banner.warning { background:#422006; border-color:#854d0e; color:#fde047; }
html[data-theme="dark"] .alert-banner.error   { background:#450a0a; border-color:#991b1b; color:#fca5a5; }
html[data-theme="dark"] .alert-banner.info    { background:#0c1a3a; border-color:#1e40af; color:#bfdbfe; }

/* ─── Misc ───────────────────────────────────────────────────────────────────── */
.skel { background:linear-gradient(90deg,var(--bg-2) 25%,var(--line-2) 37%,var(--bg-2) 63%); background-size:400% 100%; animation:shimmer 1.4s linear infinite; border-radius:8px; }
.legend-item { display:flex; align-items:center; gap:7px; font-size:13px; }
.legend-dot  { width:10px; height:10px; border-radius:3px; flex:none; }
.inv-type    { display:inline-flex; align-items:center; padding:2px 8px; border-radius:6px; font-size:11.5px; font-weight:600; }
.zack-chat { display:flex; flex-direction:column; height:calc(100vh - var(--topbar-h) - 48px); min-height:400px; }
.chat-messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px; }
.chat-bubble { max-width:80%; border-radius:16px; padding:12px 15px; font-size:14px; line-height:1.6; }
.chat-bubble.user { align-self:flex-end; background:linear-gradient(135deg,var(--brand-blue),var(--brand-blue-deep)); color:#fff; border-bottom-right-radius:4px; }
.chat-bubble.assistant { align-self:flex-start; background:var(--surface-2); border:1px solid var(--line); border-bottom-left-radius:4px; }
.chat-input-row { padding:14px 16px; border-top:1px solid var(--line); display:flex; gap:10px; background:var(--surface-2); }
.goal-progress-bar  { height:8px; background:var(--line); border-radius:99px; overflow:hidden; }
.goal-progress-fill { height:100%; border-radius:99px; transition:width .4s ease; }

/* ═══════════════════════════════════════════════════════════════════════
   TABLET — ≤880px: hide desktop sidebar, show hamburger
   ═══════════════════════════════════════════════════════════════════════ */
@media (max-width:880px) {
  #app { grid-template-columns:1fr; }
  .sidebar { display:none; }
  .hamburger-btn { display:flex !important; }
  .topbar { padding:0 14px; }
}

/* ═══════════════════════════════════════════════════════════════════════
   MOBILE — ≤640px: full mobile-first layout
   ═══════════════════════════════════════════════════════════════════════ */
@media (max-width:640px) {
  /* Typography */
  body { font-size:15px; }

  /* Page container — critical for no overflow */
  .page {
    padding:14px 12px 80px;
    width:100%; max-width:100%; overflow-x:hidden;
  }
  .page-head { margin-bottom:14px; gap:10px; }
  .page-head h1 { font-size:20px; }
  .page-head .sub { font-size:12.5px; }

  /* Topbar */
  .topbar { padding:0 12px; gap:6px; height:56px; --topbar-h:56px; }
  .search  { display:none; }

  /* Stat grid: 2 columns on mobile */
  .stat-grid { grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px !important; }
  .stat { padding:12px 10px; gap:6px; }
  .stat-head .label { font-size:9.5px; }
  .stat-icon { width:30px; height:30px; border-radius:8px; }
  .stat-icon svg { transform:scale(.85); }
  .stat-value { font-size:15px; line-height:1.2; }
  .stat-foot  { font-size:10.5px; }
  .spark-bg   { width:100px; height:38px; right:-6px; bottom:-1px; }

  /* Charts — full width, contained */
  .chart-card { padding:14px 12px; }
  .chart-head { margin-bottom:10px; }
  .chart-head h3 { font-size:13.5px; }
  .chart-tab { padding:4px 8px; font-size:11px; }

  /* Grid layouts stack */
  .grid-2-1 { grid-template-columns:1fr; gap:10px; }
  .grid-3   { grid-template-columns:1fr; gap:10px; }

  /* Cards */
  .card { border-radius:14px; }

  /* Table — horizontal scroll, not overflow */
  .table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -12px; }
  .table { font-size:12.5px; }
  .table thead th { padding:8px 10px; font-size:10px; }
  .table tbody td { padding:10px; }

  /* Buttons — bigger touch targets */
  .btn    { min-height:44px; padding:10px 14px; font-size:13.5px; }
  .btn-sm { min-height:40px; padding:8px 12px; font-size:12.5px; }
  .btn-icon { width:40px; height:40px; min-height:unset; }

  /* Inputs */
  .input, .select { min-height:50px; padding:13px 14px; }

  /* Modal — slides up from bottom */
  .modal-backdrop { padding:0; align-items:flex-end; }
  .modal { max-width:100% !important; border-radius:22px 22px 0 0; max-height:92vh; overflow-y:auto; }
  .modal-head { padding:18px 18px 8px; }
  .modal-body { padding:12px 18px 18px; }
  .modal-foot { padding:12px 18px; }

  /* Toast */
  .toast-host { bottom:16px; right:10px; left:10px; max-width:unset; }
  .toast { min-width:unset; width:100%; font-size:14px; }

  /* FAB */
  .zack-fab { bottom:16px; right:12px; width:52px; height:52px; }

  /* Chat */
  .zack-chat { height:calc(100vh - 56px - 48px); }
  .chat-messages { padding:12px; gap:10px; }
  .chat-bubble { font-size:14px; max-width:90%; padding:10px 13px; }
  .chat-input-row { padding:10px 12px; gap:8px; }

  /* Notif dropdown */
  .notif-dropdown { width:calc(100vw - 20px); right:-8px; max-height:75vh; }

  /* Auth */
  .auth-shell { grid-template-columns:1fr; }
  .auth-art   { display:none; }
  .auth-form-side { padding:28px 20px; min-height:100vh; place-items:start; padding-top:48px; }
  .auth-form-side .form-card { max-width:100%; }

  /* Hide secondary table columns on mobile */
  .col-hide-mobile { display:none; }
  .mobile-hide { display:none !important; }
}

@media print { .sidebar,.topbar,.bottom-nav,.zack-fab { display:none !important; } .page { padding:0; } }
</style>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Zack Finance — Controle financeiro inteligente</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

<style>
:root {
  --brand-blue-deep: #0B3FA8;
  --brand-blue: #1565E0;
  --brand-cyan: #1FA8E0;
  --brand-green: #1F8A4C;
  --brand-green-soft: #2DB36A;
  --brand-red: #E5484D;
  --brand-amber: #F2A03D;
  --brand-violet: #7C5CE0;
  --bg: #F6F7FB;
  --bg-2: #EEF1F7;
  --surface: #FFFFFF;
  --surface-2: #FAFBFD;
  --line: #E6E9F0;
  --line-2: #EDF0F5;
  --text: #0E1726;
  --text-2: #4B5567;
  --text-3: #8A93A6;
  --shadow-sm: 0 1px 2px rgba(15,30,60,.04), 0 1px 1px rgba(15,30,60,.03);
  --shadow-md: 0 6px 24px -8px rgba(15,30,60,.10), 0 2px 6px rgba(15,30,60,.04);
  --shadow-lg: 0 24px 60px -20px rgba(15,30,60,.20), 0 8px 20px -10px rgba(15,30,60,.10);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --sidebar-w: 256px;
  --topbar-h: 64px;
}

html[data-theme="dark"] {
  --bg: #0A0F1C;
  --bg-2: #0E1525;
  --surface: #121A2C;
  --surface-2: #0F1726;
  --line: #1F2A41;
  --line-2: #1A2438;
  --text: #EAF0FB;
  --text-2: #A6B0C5;
  --text-3: #6F7A93;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.30);
  --shadow-md: 0 8px 28px -10px rgba(0,0,0,.50), 0 2px 6px rgba(0,0,0,.30);
  --shadow-lg: 0 30px 70px -20px rgba(0,0,0,.65), 0 10px 24px -10px rgba(0,0,0,.45);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01","cv11";
  min-height: 100vh;
}
h1, h2, h3, h4 { font-family: 'Sora', 'Inter', sans-serif; letter-spacing: -0.01em; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
a { color: inherit; text-decoration: none; }

::selection { background: color-mix(in oklab, var(--brand-blue) 30%, transparent); }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 8px; border: 2px solid var(--bg); }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

.tabular { font-variant-numeric: tabular-nums; }
.mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes scaleIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(-2deg); }
  50%       { transform: translateY(-14px) rotate(-2deg); }
}
@keyframes floatAlt {
  0%, 100% { transform: translateY(0px) rotate(2deg); }
  50%       { transform: translateY(-10px) rotate(2deg); }
}

.fadein { animation: fadeIn .22s ease both; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 14px; border-radius: 10px;
  font-weight: 600; font-size: 13.5px;
  background: var(--surface); color: var(--text);
  border: 1px solid var(--line);
  transition: transform .12s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.btn:hover { background: var(--bg-2); border-color: var(--text-3); }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-deep) 100%);
  color: #fff; border-color: transparent;
  box-shadow: 0 6px 16px -8px var(--brand-blue), inset 0 1px 0 rgba(255,255,255,.18);
}
.btn-primary:hover { filter: brightness(1.06); border-color: transparent; background: linear-gradient(180deg, var(--brand-blue) 0%, var(--brand-blue-deep) 100%); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--bg-2); }
.btn-danger { color: var(--brand-red); }
.btn-danger:hover { background: color-mix(in oklab, var(--brand-red) 10%, transparent); border-color: color-mix(in oklab, var(--brand-red) 30%, transparent); }
.btn-sm { padding: 7px 10px; font-size: 12.5px; border-radius: 8px; }
.btn-icon { padding: 8px; width: 34px; height: 34px; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label { font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; }
.input, .select, .textarea {
  width: 100%;
  padding: 10px 12px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  transition: border-color .15s, box-shadow .15s, background .15s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--brand-blue);
  box-shadow: 0 0 0 4px color-mix(in oklab, var(--brand-blue) 18%, transparent);
}
.textarea { min-height: 84px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--text-3); }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px; border-radius: 999px;
  background: var(--bg-2); color: var(--text-2);
  border: 1px solid var(--line);
  font-size: 12px; font-weight: 600;
  white-space: nowrap;
}

#app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
#app.collapsed { --sidebar-w: 76px; }
@media (max-width: 880px) { #app { grid-template-columns: 1fr; } }

.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--line);
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: width .2s ease;
}
.sidebar-head {
  display: flex; align-items: center; gap: 10px;
  height: var(--topbar-h); padding: 0 16px;
  border-bottom: 1px solid var(--line);
  flex: none;
}
.brand-mark {
  width: 36px; height: 36px; border-radius: 10px;
  display: grid; place-items: center; flex: none;
  background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-deep));
  overflow: hidden;
}
.brand-name { font-family: 'Sora'; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; white-space: nowrap; }
.brand-name small { display: block; font-family: 'Inter'; font-weight: 500; color: var(--text-3); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; }

.nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.nav-section { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); padding: 14px 10px 6px; white-space: nowrap; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 9px 10px; border-radius: 10px;
  color: var(--text-2); font-weight: 500; font-size: 13.5px;
  transition: background .15s, color .15s;
  position: relative; cursor: pointer; white-space: nowrap;
}
.nav-item:hover { background: var(--bg-2); color: var(--text); }
.nav-item.active { background: color-mix(in oklab, var(--brand-blue) 10%, transparent); color: var(--brand-blue); }
html[data-theme="dark"] .nav-item.active { background: color-mix(in oklab, var(--brand-blue) 22%, transparent); color: #cfe0ff; }
.nav-item.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--brand-blue); }
.nav-item .nav-icon { width: 20px; height: 20px; flex: none; }
.nav-item .nav-badge { margin-left: auto; font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--brand-blue); color: #fff; font-weight: 700; }
#app.collapsed .nav-item span:not(.nav-badge), #app.collapsed .nav-section, #app.collapsed .brand-name, #app.collapsed .sidebar-foot-text { display: none; }
#app.collapsed .sidebar-head { justify-content: center; padding: 0; }
#app.collapsed .nav-item { justify-content: center; }
#app.collapsed .nav-item.active::before { left: -4px; }

.sidebar-foot {
  border-top: 1px solid var(--line);
  padding: 12px;
  display: flex; align-items: center; gap: 10px;
  flex: none;
}
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: none;
  background: linear-gradient(135deg, #FFB37A, #E5484D);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
}

/* ─── Hamburger button (mobile only) ─────────────────────────────────────── */
.hamburger-btn {
  display: none;
  width: 38px; height: 38px; border-radius: 10px;
  align-items: center; justify-content: center;
  color: var(--text-2); border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer; flex-shrink: 0;
  transition: background .15s, color .15s;
}
.hamburger-btn:hover { background: var(--bg-2); color: var(--text); }

/* ─── Mobile overlay + sidebar ────────────────────────────────────────────── */
.mobile-overlay {
  position: fixed; inset: 0;
  background: rgba(8,15,30,.55);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 150;
  opacity: 0; pointer-events: none;
  transition: opacity .25s ease;
}
.mobile-overlay.open { opacity: 1; pointer-events: all; }

.mobile-sidebar {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: 280px;
  background: var(--surface);
  border-right: 1px solid var(--line);
  box-shadow: var(--shadow-lg);
  z-index: 151;
  display: flex; flex-direction: column;
  transform: translateX(-100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  overflow-y: auto;
}
.mobile-sidebar.open { transform: translateX(0); }

.mobile-sidebar-head {
  display: flex; align-items: center; gap: 10px;
  height: var(--topbar-h); padding: 0 16px;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}
.mobile-sidebar-close {
  margin-left: auto; width: 34px; height: 34px; border-radius: 10px;
  display: grid; place-items: center;
  color: var(--text-2); border: 1px solid var(--line);
  background: transparent; cursor: pointer;
  transition: background .15s;
}
.mobile-sidebar-close:hover { background: var(--bg-2); }

.mobile-nav { padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
.mobile-nav-section { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; color: var(--text-3); padding: 14px 10px 6px; }
.mobile-nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px;
  color: var(--text-2); font-weight: 500; font-size: 14px;
  transition: background .15s, color .15s;
  cursor: pointer;
}
.mobile-nav-item:hover { background: var(--bg-2); color: var(--text); }
.mobile-nav-item.active { background: color-mix(in oklab, var(--brand-blue) 10%, transparent); color: var(--brand-blue); }
html[data-theme="dark"] .mobile-nav-item.active { background: color-mix(in oklab, var(--brand-blue) 22%, transparent); color: #cfe0ff; }
.mobile-nav-item .nav-badge { margin-left: auto; font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--brand-green-soft); color: #fff; font-weight: 700; }

.mobile-sidebar-foot {
  border-top: 1px solid var(--line);
  padding: 14px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0;
}

.main-area { display: flex; flex-direction: column; min-width: 0; }

.topbar {
  height: var(--topbar-h);
  background: color-mix(in oklab, var(--surface) 85%, transparent);
  backdrop-filter: saturate(140%) blur(10px);
  -webkit-backdrop-filter: saturate(140%) blur(10px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px;
  padding: 0 24px;
  position: sticky; top: 0; z-index: 50;
  flex: none;
}
.search {
  flex: 1; max-width: 460px;
  display: flex; align-items: center; gap: 10px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 8px 12px;
  color: var(--text-3);
}
.search input { background: transparent; border: 0; outline: 0; flex: 1; color: var(--text); font-size: 13.5px; }
.search kbd { font-family: 'JetBrains Mono'; font-size: 10.5px; padding: 2px 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; color: var(--text-3); }

.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  display: grid; place-items: center;
  color: var(--text-2);
  border: 1px solid transparent;
  transition: background .15s, color .15s;
  position: relative;
  cursor: pointer;
}
.icon-btn:hover { background: var(--bg-2); color: var(--text); }
.icon-btn .ping { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 999px; background: var(--brand-red); border: 2px solid var(--surface); }

.page { padding: 28px; max-width: 1400px; margin: 0 auto; animation: fadeIn .25s ease both; flex: 1; }
@media (max-width: 640px) { .page { padding: 18px 16px 32px; } }

.page-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { font-size: 26px; font-weight: 700; }
.page-head .sub { color: var(--text-2); font-size: 13.5px; margin-top: 4px; }

.stat-grid { display: grid; gap: 16px; grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .stat-grid { grid-template-columns: 1fr; } }

.stat { padding: 18px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.stat-head { display: flex; align-items: center; justify-content: space-between; }
.stat-head .label { font-size: 12.5px; color: var(--text-2); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
.stat-icon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.stat-value { font-family: 'Sora'; font-weight: 700; font-size: 26px; letter-spacing: -.02em; }
.stat-foot { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.delta-up { color: var(--brand-green-soft); font-weight: 600; }
.delta-down { color: var(--brand-red); font-weight: 600; }
.spark-bg { position: absolute; right: -10px; bottom: -2px; width: 160px; height: 56px; opacity: .55; pointer-events: none; }

.grid-2-1 { display: grid; gap: 16px; grid-template-columns: 2fr 1fr; }
@media (max-width: 1000px) { .grid-2-1 { grid-template-columns: 1fr; } }

.table-wrap { overflow: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
.table thead th { text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 1; }
.table tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.table tbody tr:hover td { background: var(--surface-2); }
.table tbody tr:last-child td { border-bottom: 0; }

.cat-pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }

.modal-backdrop {
  position: fixed; inset: 0; background: rgba(8,15,30,.5);
  backdrop-filter: blur(4px);
  display: grid; place-items: center;
  z-index: 200; padding: 16px;
  animation: fadeIn .15s ease both;
}
.modal {
  width: 100%; max-width: 520px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  animation: scaleIn .18s cubic-bezier(.2,.9,.3,1.2) both;
  overflow: hidden;
}
.modal-head { padding: 20px 20px 8px; display: flex; justify-content: space-between; align-items: start; }
.modal-head h3 { font-size: 18px; font-weight: 700; }
.modal-head p { color: var(--text-2); font-size: 13px; margin: 4px 0 0; }
.modal-body { padding: 14px 20px 20px; display: grid; gap: 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; background: var(--surface-2); }

.toast-host { position: fixed; bottom: 24px; right: 24px; z-index: 300; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.toast {
  background: var(--surface); border: 1px solid var(--line);
  padding: 12px 14px; border-radius: 12px; box-shadow: var(--shadow-md);
  display: flex; align-items: center; gap: 10px;
  min-width: 240px;
  animation: scaleIn .2s ease both;
  pointer-events: all;
}
.toast .dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }

/* Bottom nav hidden by default */
.bottom-nav { display: none !important; }

@media (max-width: 880px) {
  .sidebar { display: none; }
  .hamburger-btn { display: flex !important; }
}

.chart-card { padding: 20px; }
.chart-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.chart-head h3 { font-size: 15.5px; font-weight: 700; }
.chart-tabs { display: flex; gap: 4px; padding: 3px; background: var(--bg-2); border-radius: 8px; border: 1px solid var(--line); }
.chart-tab { padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: background .15s, color .15s; }
.chart-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

.zack-fab {
  position: fixed; bottom: 28px; right: 28px;
  width: 60px; height: 60px; border-radius: 50%;
  background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-deep));
  display: grid; place-items: center;
  box-shadow: 0 8px 24px -8px rgba(21,101,224,.6), 0 4px 10px rgba(0,0,0,.15);
  z-index: 70;
  transition: transform .15s ease, box-shadow .15s;
  cursor: pointer;
  color: #fff;
  border: none;
  overflow: hidden;
}
.zack-fab:hover { transform: translateY(-2px) scale(1.06); box-shadow: 0 12px 32px -8px rgba(21,101,224,.7); }
.zack-fab:active { transform: scale(.97); }
@media (max-width: 880px) { .zack-fab { bottom: 20px; right: 16px; width: 52px; height: 52px; } }

/* ─── Auth page ───────────────────────────────────────────────────────────── */
.auth-shell {
  min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
}
@media (max-width: 900px) { .auth-shell { grid-template-columns: 1fr; } .auth-art { display: none; } }
.auth-art {
  position: relative; overflow: hidden;
  min-height: 100vh;
  background:
    radial-gradient(80% 60% at 30% 20%, color-mix(in oklab, var(--brand-cyan) 40%, transparent), transparent 60%),
    radial-gradient(70% 80% at 80% 80%, color-mix(in oklab, var(--brand-green-soft) 35%, transparent), transparent 60%),
    linear-gradient(180deg, var(--brand-blue-deep), #061738);
  color: #fff;
  padding: 48px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.auth-form-side { display: grid; place-items: center; padding: 32px; background: var(--bg); }
.auth-form-side .form-card { width: 100%; max-width: 400px; }

/* ─── Mockup float cards ──────────────────────────────────────────────────── */
.mockup-cards-area {
  position: absolute;
  right: -10px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; align-items: flex-end;
  gap: 0; pointer-events: none;
  z-index: 2;
}
.mockup-card {
  animation: float 5s ease-in-out infinite;
  transform-origin: center;
  filter: drop-shadow(0 24px 48px rgba(0,0,0,.45));
}
.mockup-card-secondary {
  animation: floatAlt 6.5s ease-in-out infinite;
  transform-origin: center;
  filter: drop-shadow(0 16px 36px rgba(0,0,0,.35));
  margin-top: -60px;
  margin-right: 30px;
}

/* ─── Skeleton ────────────────────────────────────────────────────────────── */
.skel {
  background: linear-gradient(90deg, var(--bg-2) 25%, var(--line-2) 37%, var(--bg-2) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: 8px;
}

.legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }

.inv-type { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 11.5px; font-weight: 600; }

.zack-chat { display: flex; flex-direction: column; height: calc(100vh - var(--topbar-h) - 56px); min-height: 400px; }

.chat-bubble.user { align-self: flex-end; background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-deep)); color: #fff; border-bottom-right-radius: 4px; }

.chat-input-row { padding: 16px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; background: var(--surface-2); }
